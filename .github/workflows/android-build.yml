name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - run: pnpm install

      - run: pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: harbor-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
